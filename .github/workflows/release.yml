name: Publish release

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  EM_VERSION: 2.0.24
  EM_CACHE_FOLDER: emsdk-cache

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: Generate parser
        run: npm run generate

      # - name: Run tests
      #   run: npm test

      - name: Build WASM
        run: |
          emcc \
            -o tree-sitter-amxxpawn.wasm \
            -Os \
            -s WASM=1 \
            -I src \
            -s SIDE_MODULE=1 \
            -s EXPORTED_FUNCTIONS='["_tree_sitter_amxxpawn"]' \
            -fno-exceptions \
            src/parser.c \
            src/scanner.c

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: tree-sitter-amxxpawn.wasm

  npm:
    name: Publish npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish
        uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}

  cargo:
    name: Publish Cargo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        uses: katyo/publish-crates@v1
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: tree-sitter-amxxpawn.wasm
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
